# E1: the LLM judge on all 20 papers, all 10 system pairs in both A/B orders (400 calls).
# Read by `plan-e1 --config`. Calls on one of the 20 human tasks are marked `human_task`.

e1:
  id: e1_main_v5
  rubric_version: novelty_report_judge_v5
  judge_model: gpt-6.1-sol
  judge_effort: medium
  inventory: true
  seed: 42  # shuffles the execution order only
  expected_papers: 20
  systems: [agent, linear, opennovelty, deepreviewer, afzal]
  out_dir: final_evaluation/results/main/e1

paper_sets:
  - config: final_evaluation/config/main.yaml
    role: human_rated
  - config: final_evaluation/config/e1_extra.yaml
    role: e1_only
