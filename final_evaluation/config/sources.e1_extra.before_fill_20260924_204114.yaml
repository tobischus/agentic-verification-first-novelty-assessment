# Source resolution for the human study. Generated by eval/human_study_prep.py;
# every TODO below needs a human decision, and nothing here was picked by mtime.
#
# deepreviewer: point `file` at final_report_review_only.pdf (produced by
#   eval/deepreviewer_review_pdf.py) -- DeepReviewer's own final_report.pdf
#   appends the full annotated submission and is ~4x longer than every other
#   report in the study.

all_code_no_thought:
  submission:
    pdf: "final_evaluation/inputs/main/new 10/paper/ALL CODE, NO THOUGHT.pdf"
    # TODO: text: the frozen submission text the E1 judge reads.
    #   The pilot took MinerU's markdown from the DeepReviewer job
    #   dir, because GROBID's section text drops display equations
    #   and table bodies and the judge checks claims about the
    #   submission against the submission. Same parser for every
    #   paper, so resolve this only once DeepReviewer has run.
  agent:
    kind: rendered
    renderer: battle_export.build
    variant: agent
    artifact_a: data/all_code_no_thought/all_code_no_thought_artifact_a_agent.json
    artifact_b: data/all_code_no_thought/all_code_no_thought_artifact_b_agent.json
  linear:
    kind: rendered
    renderer: battle_export.build
    variant: linear
    artifact_a: data/all_code_no_thought/all_code_no_thought_artifact_a_linear.json
    artifact_b: data/all_code_no_thought/all_code_no_thought_artifact_b_linear.json
  opennovelty:
    kind: native_pdf
    path: "final_evaluation/inputs/main/new 10/opennovelty/novelty_report_lightweight_All_Code_No_Thought_Language_Models_Struggle_to_Re_20251229.pdf"
    resolution_note: matched by title against the authors' filename
  deepreviewer:
    kind: deepreviewer_job
    # TODO: job_dir: DeepReviewer-v2/data/jobs/<id>
    file: final_report_review_only.pdf
  afzal:
    kind: concat_text
    parts:
      - data/all_code_no_thought/summary.txt
      - "---"
      - data/all_code_no_thought/novelty_delta_analysis.txt

