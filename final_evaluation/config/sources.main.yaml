# Sources of the frozen study inputs, read by `import-inputs`.
# submission.text: MinerU markdown of the submission (eval/human_study_submission_text.py).
# deepreviewer: report without the annotated submission (eval/deepreviewer_review_pdf.py).

agentgym_rl:
  submission:
    pdf: "human_study/paper/AgentGym-RL.pdf"
    text: eval/out/human_study/submission_text/agentgym_rl__submission.txt
  agent:
    kind: rendered
    variant: agent
    artifact_a: data/agentgym_rl/agentgym_rl_artifact_a_agent.json
    artifact_b: data/agentgym_rl/agentgym_rl_artifact_b_agent.json
  linear:
    kind: rendered
    variant: linear
    artifact_a: data/agentgym_rl/agentgym_rl_artifact_a_linear.json
    artifact_b: data/agentgym_rl/agentgym_rl_artifact_b_linear.json
  opennovelty:
    kind: native_pdf
    path: "human_study/OpenNovelty/novelty_report_lightweight_AgentGym_RL_An_Open_Source_Framework_to_Train_LLM__20251227.pdf"
    resolution_note: matched by title against the authors' filename
  deepreviewer:
    kind: deepreviewer_job
    job_dir: DeepReviewer-v2/data/jobs/1fb6b395-6c52-43da-aa24-728b15309f9f
    file: final_report_review_only.pdf
  afzal:
    kind: concat_text
    parts:
      - data/agentgym_rl/summary.txt
      - "---"
      - data/agentgym_rl/novelty_delta_analysis.txt

