# Main study: the ten human-rated papers. Read by import-inputs, validate-inputs,
# seed-study and create-participants.

inputs_dir: main

study:
  id: main_study_v2
  title: "Novelty report comparison -- main study"
  is_pilot: false
  rubric_version: novelty_report_judge_v5
  instructions_version: human_instructions_v2
  ui_version: dashboard_v1
  assignment_seed: 43
  order_seed_base: 100

systems:
  - agent
  - linear
  - opennovelty
  - deepreviewer
  - afzal

papers:
  agentgym_rl:
    title: "AgentGym-RL: Training LLM Agents for Long-Horizon Decision Making through Multi-Turn Reinforcement Learning"
  astabench:
    title: "AstaBench: Rigorous Benchmarking of AI Agents with a Scientific Research Suite"
  editbench:
    title: "EDIT-Bench: Evaluating LLM Abilities to Perform Real-World Instructed Code Edits"
  hubble:
    title: "Hubble: A Model Suite to Advance the Study of LLM Memorization"
  language_confusion_gate:
    title: "Language Confusion Gate: Language-Aware Decoding through Model Self-Distillation"
  llms_get_lost_in_multi_turn_conversation:
    title: "LLMs Get Lost in Multi-Turn Conversation"
  mixing_mechanisms:
    title: "Mixing Mechanisms: How Language Models Retrieve Bound Entities In-Context"
  output_supervision_can_obfuscate_the_chain_of:
    title: "Output Supervision Can Obfuscate the Chain of Thought"
  the_art_of_scaling_reinforcement_learning:
    title: "The Art of Scaling Reinforcement Learning Compute for LLMs"
  train_before_test_harmonizes_language_model:
    title: "Train-before-Test Harmonizes Language Model Rankings"

# Each paper i = 0..9 (in the order above) pairs agent with each external system except
# [afzal, deepreviewer, opennovelty][i % 3]. `pair` is in alphabetical order.
tasks:
  - paper: agentgym_rl
    pair: [agent, deepreviewer]
  - paper: agentgym_rl
    pair: [agent, opennovelty]
  - paper: astabench
    pair: [afzal, agent]
  - paper: astabench
    pair: [agent, opennovelty]
  - paper: editbench
    pair: [afzal, agent]
  - paper: editbench
    pair: [agent, deepreviewer]
  - paper: hubble
    pair: [agent, deepreviewer]
  - paper: hubble
    pair: [agent, opennovelty]
  - paper: language_confusion_gate
    pair: [afzal, agent]
  - paper: language_confusion_gate
    pair: [agent, opennovelty]
  - paper: llms_get_lost_in_multi_turn_conversation
    pair: [afzal, agent]
  - paper: llms_get_lost_in_multi_turn_conversation
    pair: [agent, deepreviewer]
  - paper: mixing_mechanisms
    pair: [agent, deepreviewer]
  - paper: mixing_mechanisms
    pair: [agent, opennovelty]
  - paper: output_supervision_can_obfuscate_the_chain_of
    pair: [afzal, agent]
  - paper: output_supervision_can_obfuscate_the_chain_of
    pair: [agent, opennovelty]
  - paper: the_art_of_scaling_reinforcement_learning
    pair: [afzal, agent]
  - paper: the_art_of_scaling_reinforcement_learning
    pair: [agent, deepreviewer]
  - paper: train_before_test_harmonizes_language_model
    pair: [agent, deepreviewer]
  - paper: train_before_test_harmonizes_language_model
    pair: [agent, opennovelty]

participants:
  count: 3
  prefix: "M"
  test: false
